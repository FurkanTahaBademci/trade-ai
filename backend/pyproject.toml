[project]
name = "trade-ai-backend"
version = "0.1.0"
description = "BIST piyasa istihbarati ve paper trading backend'i"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "tenacity>=9.0",
    "feedparser>=6.0",
    "structlog>=24.4",
    "isyatirimhisse>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: gercek disaridaki servislere baglanan testler (ag gerektirir)",
]
