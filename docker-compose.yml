x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeai}
      POSTGRES_DB: ${POSTGRES_DB:-tradeai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeai} -d ${POSTGRES_DB:-tradeai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
    # Coolify: dis dunyaya port acma, sadece internal network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host'a port acilmiyor: Coolify proxy'si icsel agdan (Ports Exposes: 8000)
    # baglanir. Yerel gelistirmede host port'u docker-compose.override.yml
    # saglar (docker compose otomatik birlestirir).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1G}
    command: >
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.tasks.schedule.WorkerSettings", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2G}
    command: ["arq", "app.tasks.schedule.WorkerSettings"]
    # Dis dunyaya port acilmiyor - sadece Redis'ten is aliyor.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://api:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-admin}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    # Host'a port acilmiyor: Coolify proxy'si icsel agdan (Ports Exposes: 3000)
    # baglanir. Yerel gelistirmede host port'u docker-compose.override.yml
    # saglar (docker compose otomatik birlestirir).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-512M}

volumes:
  postgres_data:
  redis_data:
