name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml surum etiketlerinde bu is akisini cagirir.
  workflow_call:
    secrets:
      LEAK_DENY_PATTERNS:
        required: false

permissions:
  contents: read

jobs:
  leak-check:
    name: Leak check (gitleaks + desenler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret ve kisisel veri taramasi
        env:
          # Opsiyonel repo secret'i: canli domain gibi kisiye ozel desenler.
          # Fork'tan gelen PR'larda bos olur; genel desenler yine calisir.
          LEAK_DENY_PATTERNS: ${{ secrets.LEAK_DENY_PATTERNS }}
          GITLEAKS_DOCKER: "1"
        run: ./ops/leak-check.sh

  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests scripts

      - name: Pytest
        run: pytest -q

      - name: Alembic offline DDL check
        run: alembic upgrade head --sql > /dev/null

  web:
    name: Web (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
